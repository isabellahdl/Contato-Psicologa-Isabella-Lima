<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isabella Lima · Psicóloga</title>
  <meta name="description" content="Isabella Lima, psicóloga. Agende sua conversa pelo WhatsApp.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5ef;
      --card: #fbfbf7;
      --ink: #151515;
      --muted: #6b6b66;
      --mustard: #dbb840;
      --terracotta: #be8059;
      --terracotta-dark: #a86a45;
      --gray: #b4b4b0;
      --line: #e3e3dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Archivo", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* formas orgânicas no fundo, nas cores do logo */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .55;
      pointer-events: none;
      z-index: 0;
    }
    .blob.b1 { width: 380px; height: 340px; background: var(--mustard); top: -120px; left: -110px; border-radius: 60% 40% 55% 45%; }
    .blob.b2 { width: 380px; height: 340px; background: var(--terracotta); bottom: -150px; right: -130px; border-radius: 45% 55% 40% 60%; }
    .blob.b3 { width: 180px; height: 180px; background: var(--gray); top: 50%; left: -80px; opacity: .45; }
    .blob.b4 { width: 120px; height: 120px; background: var(--mustard); bottom: 12%; right: 8%; opacity: .35; }
    .blob.b5 { width: 90px; height: 90px; background: var(--terracotta); top: 12%; right: 10%; opacity: .3; }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px 32px 32px;
      text-align: center;
      box-shadow: 0 24px 50px -28px rgba(21, 21, 21, .25);
      overflow: hidden;
      animation: rise .8s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 8px;
      background: linear-gradient(90deg, var(--mustard) 0 33.3%, var(--terracotta) 33.3% 66.6%, var(--gray) 66.6%);
    }
    .hero {
      margin: -40px -32px 0;
      padding: 44px 32px 26px;
      /* mesma cor do fundo da logo, para ela se encaixar sem moldura */
      background: linear-gradient(180deg, #f4f5ef 0 70%, var(--card));
    }
    .logo {
      width: 280px;   /* tamanho real da imagem: não estica nem distorce */
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }
    .role {
      font-size: 19px;
      font-weight: 500;
      margin-top: 4px;
      color: var(--terracotta-dark);
    }
    .intro {
      margin: 22px auto 0;
      max-width: 340px;
      font-size: 16px;
      line-height: 1.55;
      color: var(--muted);
    }

    .divider {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 26px 0;
    }
    .divider i { width: 9px; height: 9px; border-radius: 50%; display: block; }
    .divider i:nth-child(1) { background: var(--mustard); }
    .divider i:nth-child(2) { background: var(--terracotta); }
    .divider i:nth-child(3) { background: var(--gray); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      background: var(--terracotta);
      color: #fff;
      font: 700 17px "Archivo", sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .btn:hover { background: var(--terracotta-dark); transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }
    .btn.secondary { background: var(--mustard); color: var(--ink); }
    .btn.secondary:hover { background: #c9a630; }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--terracotta-dark);
    }

    .form-panel {
      margin: 30px -32px -32px;
      padding: 26px 32px 30px;
      background: linear-gradient(180deg, rgba(219,184,64,.16), rgba(190,128,89,.12));
      border-top: 1px solid var(--line);
    }
    form { text-align: left; margin-top: 6px; }
    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin: 14px 0 6px 2px;
    }
    input, textarea {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid #e2d6bd;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: 16px "Archivo", sans-serif;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea { resize: vertical; min-height: 96px; }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--mustard);
      box-shadow: 0 0 0 4px rgba(219, 184, 64, .22);
    }
    form .btn { margin-top: 20px; }

    footer {
      margin-top: 26px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .card { padding: 32px 20px 26px; }
      .hero { margin: -32px -20px 0; padding: 40px 20px 22px; }
      .form-panel { margin: 26px -20px -26px; padding: 22px 20px 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>

  <main class="card">
    <div class="hero">
    <img class="logo" src="logo.png" width="280" height="175" alt="Isabella Lima, Psicóloga">
    <h1 class="sr-only">Isabella Lima, Psicóloga</h1>
    <p class="intro">Um espaço de escuta acolhedor e sem julgamentos. Vamos conversar?</p>
    </div>

    <div class="divider" aria-hidden="true"><i></i><i></i><i></i></div>

    <a id="wpp-direct" class="btn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.7l-.4-.3-3.8 1.2 1.2-3.7-.3-.4c-1.2-1.8-1.8-3.8-1.8-5.9C5 9.9 10 5.1 16 5.1s11 4.8 11 10.7-5 10.6-11 10.6zm6-7.9c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.6-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.5c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 2-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.2-.3-.3-.6-.4z"/></svg>
      Agendar pelo WhatsApp
    </a>

    <div class="form-panel">
    <p class="section-title">ou envie uma mensagem</p>

    <form id="wpp-form">
      <label for="nome">Seu nome</label>
      <input id="nome" name="nome" type="text" placeholder="Como posso te chamar?" autocomplete="name" required>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" placeholder="Conte brevemente como posso te ajudar…" required></textarea>

      <button class="btn secondary" type="submit">Enviar pelo WhatsApp</button>
    </form>

    <footer>© Isabella Lima · Psicóloga</footer>
    </div>
  </main>

  <script>
    // ✏️ Troque pelo seu número: código do país + DDD + número, só dígitos (ex.: 5511999998888)
    const WHATSAPP_NUMBER = "5500000000000";
    const DEFAULT_MESSAGE = "Olá, Isabella! Vim pelo seu site e gostaria de agendar uma conversa.";

    const waLink = (text) =>
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;

    document.getElementById("wpp-direct").href = waLink(DEFAULT_MESSAGE);

    document.getElementById("wpp-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const nome = document.getElementById("nome").value.trim();
      const msg = document.getElementById("mensagem").value.trim();
      const texto = `Olá, Isabella! Meu nome é ${nome}.\n\n${msg}`;
      window.open(waLink(texto), "_blank", "noopener");
    });
  </script>
</body>
</html>
